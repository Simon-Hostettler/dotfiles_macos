[general]
live_config_reload = true

[terminal]
shell = { program = "/bin/zsh", args = ["-l", "-c", "~/.config/tmux/startup.sh"] }
osc52 = "CopyPaste"

[window]
padding = { x = 13, y = 13 }
dimensions = { columns = 150, lines = 50 }
decorations = "Full"
opacity = 0.8
blur = true
startup_mode = "Windowed"
dynamic_title = true
option_as_alt = "OnlyLeft"

[font]
size = 14.0

[font.normal]
family = "SF Mono"
style = "Regular"

[font.bold]
family = "SF Mono"
style = "Bold"

[font.italic]
family = "SF Mono"
style = "Italic"

[font.bold_italic]
family = "SF Mono"
style = "Bold Italic"

# OneDark color scheme
[colors.primary]
background = "#282c34"
foreground = "#abb2bf"

[colors.cursor]
text = "#282c34"
cursor = "#abb2bf"

[colors.normal]
black   = "#282c34"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#61afef"
magenta = "#c678dd"
cyan    = "#56b6c2"
white   = "#abb2bf"

[colors.bright]
black   = "#5c6370"
red     = "#e9969d"
green   = "#b3d39c"
yellow  = "#edd4a6"
blue    = "#8fc6f4"
magenta = "#d7a1e7"
cyan    = "#7bc6d0"
white   = "#c8cdd5"

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
    { key = "Return", mods = "Shift", chars = "\n" },
]
